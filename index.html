<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>GitHub 文件加速下载 - Release、Raw 与源码代理</title>
    <meta name="description" content="免费的 GitHub 文件加速工具，支持 releases 下载、源码归档、blob、raw、gist 与 tags 等链接加速，无需登录即可使用。">
    <link rel="icon" href="/favicon.ico">
    <style>
        :root {
            --bg: #f4f6fb;
            --bg-accent: #e7ecf9;
            --card: #ffffff;
            --text: #1c2233;
            --muted: #6b7488;
            --border: #e2e6f0;
            --primary: #3b6cf6;
            --primary-hover: #2f5ae0;
            --primary-ring: rgba(59, 108, 246, .25);
            --chip: #f0f3fa;
            --shadow: 0 20px 50px -20px rgba(28, 34, 51, .28);
        }

        :root[data-theme="dark"] {
            --bg: #0e1220;
            --bg-accent: #141a2e;
            --card: #171d30;
            --text: #e9edf6;
            --muted: #9aa3ba;
            --border: #262e46;
            --primary: #5b86ff;
            --primary-hover: #6f95ff;
            --primary-ring: rgba(91, 134, 255, .3);
            --chip: #1f2740;
            --shadow: 0 24px 60px -24px rgba(0, 0, 0, .7);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background:
                radial-gradient(1200px 600px at 15% -10%, var(--bg-accent), transparent 60%),
                radial-gradient(1000px 500px at 110% 110%, var(--bg-accent), transparent 55%),
                var(--bg);
        }

        .card {
            width: 100%;
            max-width: 640px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 36px 32px;
            box-shadow: var(--shadow);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .brand svg { flex: none; }

        .theme-toggle {
            margin-left: auto;
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--chip);
            color: var(--muted);
            border: 1px solid transparent;
            cursor: pointer;
            transition: background .15s, color .15s, border-color .15s;
        }

        .theme-toggle:hover { color: var(--primary); border-color: var(--border); }
        .theme-toggle svg { display: none; }
        :root[data-theme="light"] .theme-toggle .icon-moon { display: block; }
        :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

        h1 {
            font-size: 26px;
            line-height: 1.25;
            margin: 0;
            letter-spacing: .2px;
        }

        .subtitle {
            margin: 0 0 26px;
            color: var(--muted);
            font-size: 14.5px;
            line-height: 1.6;
        }

        form { margin: 0; }

        .field {
            display: flex;
            gap: 10px;
        }

        .input-wrap {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .input-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        input.url {
            width: 100%;
            height: 52px;
            padding: 0 16px 0 42px;
            font-size: 15px;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
        }

        input.url::placeholder { color: var(--muted); }

        input.url:focus {
            border-color: var(--primary);
            background: var(--card);
            box-shadow: 0 0 0 4px var(--primary-ring);
        }

        .btn {
            height: 52px;
            padding: 0 26px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s ease, transform .05s ease;
        }

        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: translateY(1px); }

        .hint {
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--muted);
            min-height: 16px;
        }

        .result {
            margin-top: 12px;
            padding: 13px 15px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .result-label {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: .04em;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .result-url {
            display: block;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12.5px;
            line-height: 1.55;
            color: var(--text);
            word-break: break-all;
        }

        .result-url .origin { color: var(--primary); }

        .result-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .mini {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 7px 14px;
            cursor: pointer;
            transition: border-color .15s, color .15s, background .15s;
        }

        .mini:hover { border-color: var(--primary); color: var(--primary); }

        .mini.primary {
            color: #fff;
            background: var(--primary);
            border-color: transparent;
        }

        .mini.primary:hover { background: var(--primary-hover); color: #fff; }

        .mini:disabled { opacity: .6; cursor: default; }

        .nodes {
            margin-top: 22px;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 16px 14px;
            background: var(--bg);
        }

        .nodes-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .nodes-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .nodes-head-actions {
            display: flex;
            gap: 8px;
            flex: none;
        }

        .node-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .node {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 7px;
            font: inherit;
            text-align: left;
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 11px 13px;
            cursor: pointer;
            transition: border-color .15s, box-shadow .15s, transform .05s;
        }

        .node:hover { border-color: var(--primary); }

        .node:active { transform: translateY(1px); }

        .node.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-ring);
        }

        .node-top {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .node-name {
            flex: 1;
            min-width: 0;
            font-size: 13px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .node.active .node-name { color: var(--primary); }

        .lat-dot {
            flex: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            transition: background .15s;
        }

        .lat-dot.fast { background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, .18); }
        .lat-dot.medium { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, .18); }
        .lat-dot.slow { background: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, .18); }

        .lat {
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .lat.fast { color: #16a34a; }
        .lat.medium { color: #d97706; }
        .lat.slow { color: #dc2626; }

        .node-badge {
            position: absolute;
            top: -8px;
            right: 10px;
            font-size: 10px;
            font-weight: 600;
            line-height: 1;
            color: #fff;
            background: #22c55e;
            border-radius: 999px;
            padding: 3px 7px;
            display: none;
        }

        .node.recommended .node-badge { display: inline-block; }

        .releases {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .release {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: var(--card);
        }

        .release-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 12px 15px;
            background: var(--bg);
        }

        .release-tag {
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
        }

        .release-tag:hover { text-decoration: underline; }

        .release-meta {
            font-size: 12.5px;
            color: var(--muted);
        }

        .asset {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            border-top: 1px solid var(--border);
            font-size: 13px;
        }

        .asset-name {
            flex: 1;
            min-width: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .asset-size {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .asset-dl {
            flex: none;
            font-size: 12.5px;
            font-weight: 600;
            color: #fff;
            background: var(--primary);
            border-radius: 8px;
            padding: 5px 12px;
            text-decoration: none;
            transition: background .15s;
        }

        .asset-dl:hover { background: var(--primary-hover); }

        .releases-tip,
        .releases-err {
            margin: 0;
            padding: 14px 16px;
            font-size: 13px;
            color: var(--muted);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .footer .footer-icon {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px; padding: 8px 16px; border-radius: 999px;
            background: var(--chip); color: var(--muted) !important;
            font-size: 12px; text-decoration: none;
            transition: background .2s, color .2s;
        }
        .footer .footer-icon:hover {
            background: var(--primary); color: #fff !important;
        }

        .notes {
            margin: 26px 0 0;
            padding: 16px 18px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.7;
        }

        .notes ul {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 12px;
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .notes li {
            display: flex;
            gap: 8px;
        }
        .notes li::before {
            content: "•";
            color: var(--primary);
        }

        .footer {
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 12.5px;
            color: var(--muted);
            text-align: center;
        }

        /* ================= 留言板 ================= */
        .guestbook {
            margin-top: 26px;
            padding: 18px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .guestbook-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .guestbook-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .guestbook-count {
            font-size: 12px;
            color: var(--muted);
        }

        .gb-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 18px;
        }

        .gb-name,
        .gb-text {
            width: 100%;
            font-family: inherit;
            font-size: 14px;
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .gb-name { height: 42px; }

        .gb-text {
            min-height: 84px;
            resize: vertical;
            line-height: 1.6;
        }

        .gb-name:focus,
        .gb-text:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-ring);
        }

        .gb-form-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .gb-tip {
            font-size: 12.5px;
            color: var(--muted);
            min-height: 16px;
        }

        .gb-submit {
            flex: none;
            height: 38px;
            padding: 0 22px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background .15s;
        }

        .gb-submit:hover { background: var(--primary-hover); }
        .gb-submit:disabled { opacity: .6; cursor: default; }

        .gb-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .gb-item {
            padding: 12px 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .gb-item-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .gb-item-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
        }

        .gb-item-time {
            font-size: 11.5px;
            color: var(--muted);
        }

        .gb-item-text {
            font-size: 13.5px;
            line-height: 1.65;
            color: var(--text);
            word-break: break-word;
            white-space: pre-wrap;
        }

        .gb-empty {
            margin: 0;
            padding: 20px;
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            background: var(--card);
            border: 1px dashed var(--border);
            border-radius: 12px;
        }

        @media (max-width: 560px) {
            .card { padding: 28px 22px 24px; border-radius: 16px; }
            .field { flex-direction: column; }
            .btn { width: 100%; }
            h1 { font-size: 22px; }
        }
        button:focus,
        button:active,
        a:focus,
        a:active {
            outline: none;
            box-shadow: none;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme')
                var theme = saved ? saved : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                document.documentElement.setAttribute('data-theme', theme)
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light')
            }
        })()
    </script>
</head>
<body>
    <main class="card">
        <div class="brand">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49

                    1 .07 1.53 1.05 1.53 1.05.9 1.57 2.34 1.12 2.91.86.09-.67.35-1.12.63-1.38-2.22-.26-4.56-1.14-4.56-5.06

                    fill="currentColor"/>
            </svg>
            <h1>GitHub 文件加速</h1>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换主题" title="切换深/浅色">
                <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>
        <p class="subtitle">粘贴 GitHub 链接，加速下载 release、源码归档或单文件。</p>

        <form action="./" method="get" target="_blank" id="form" novalidate>
            <div class="field">
                <label class="input-wrap">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72"
                              stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.72"
                              stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <input class="url" name="q" id="q" type="text" autocomplete="off" spellcheck="false"
                           placeholder="请输入链接"
                           pattern="^((https|http):\/\/)?(github\.com\/.+?\/.+?\/(?:releases|archive|blob|raw)|((?:raw|gist)\.(?:githubusercontent|github)\.com))\/.+$"
                           required>
                </label>
                <button class="btn" type="submit">加速下载</button>
            </div>
            <div class="hint" id="hint">支持带或不带 https:// 协议头</div>

            <div class="nodes">
                <div class="nodes-head">
                    <span class="nodes-title">加速节点</span>
                    <div class="nodes-head-actions">
                        <button class="mini primary" id="releases-btn" type="button">获取 Releases 列表</button>
                        <button class="mini" id="speed-btn" type="button">测速</button>
                    </div>
                </div>
                <div class="node-list" id="node-list"></div>
            </div>

            <div class="result" id="result" hidden>
                <span class="result-label">加速链接</span>
                <code class="result-url" id="result-url"></code>
                <div class="result-actions">
                    <button class="mini" id="copy-btn" type="button">复制</button>
                    <button class="mini primary" id="open-btn" type="button">下载</button>
                </div>
            </div>

            <div class="releases" id="releases" hidden></div>
        </form>

        <div class="notes">
            <ul>
                <li>Releases 文件</li>
                <li>Releases 源码</li>
                <li>分支源码</li>
                <li>Raw 文件</li>
                <li>分支文件</li>
                <li>Gist</li>
                <li>Tags 页</li>
            </ul>
        </div>

        <!-- 留言板 -->
        <section class="guestbook" id="guestbook">
            <div class="guestbook-head">
                <span class="guestbook-title">留言板</span>
                <span class="guestbook-count" id="gb-count"></span>
            </div>

            <form class="gb-form" id="gb-form">
                <input class="gb-name" id="gb-name" type="text" maxlength="20" placeholder="昵称（可留空）" autocomplete="off">
                <textarea class="gb-text" id="gb-text" maxlength="300" placeholder="写点什么…" required></textarea>
                <div class="gb-form-foot">
                    <span class="gb-tip" id="gb-tip"></span>
                    <button class="gb-submit" type="submit" id="gb-submit">发布</button>
                </div>
            </form>

            <div class="gb-list" id="gb-list">
                <p class="gb-empty">还没有留言，来抢沙发～</p>
            </div>
        </section>

        <p class="footer" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center;">
            <a href="mailto:admin@u0.cc.cd" class="footer-icon" title="Email"
               style="display:inline-flex; align-items:center; gap:6px; padding:8px 16px;
                      background:#f1f3f5; border-radius:999px; color:#333; text-decoration:none; font-size:14px;">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
                <span>admin@u0.cc.cd</span>
            </a>

            <a href="javascript:void(0)" id="donateBtn"
               style="display:inline-flex; align-items:center; gap:6px; padding:8px 16px;
                      background:#fff3e0; border-radius:999px; color:#e8590c; text-decoration:none;
                      font-size:14px; font-weight:500;">
                ☕ 请我喝杯咖啡
            </a>
        </p>

    <!-- 捐赠弹窗 -->
    <div id="donateModal" style="display:none; position:fixed; inset:0;
         background:rgba(0,0,0,.6); z-index:9999;
         align-items:center; justify-content:center;">
      <div style="background:#fff; color:#333; padding:24px; border-radius:12px;
           text-align:center; max-width:90vw; box-shadow:0 10px 40px rgba(0,0,0,.3);">
        <h3 style="margin:0 0 12px;">感谢你的支持！</h3>
        <img src="/images/donate-qr.png" width="220" height="220"
             alt="收款码" style="max-width:100%; border-radius:8px;">
        <p style="margin:8px 0 16px; font-size:14px; color:#666;">扫码支持作者</p>
        <button id="donateClose"
                style="padding:8px 20px; border:none; border-radius:6px;
                background:#FF813F; color:#fff; cursor:pointer;">关闭</button>
      </div>

    <script>
    (function () {
      var modal = document.getElementById('donateModal');
      var btn = document.getElementById('donateBtn');
      var close = document.getElementById('donateClose');
      if (!modal || !btn) return;

      btn.onclick = function () { modal.style.display = 'flex'; };
      close.onclick = function () { modal.style.display = 'none'; };
      modal.onclick = function (e) {
        if (e.target === modal) modal.style.display = 'none';
      };
    })();
    </script>

    <script>
        const RE = /^((https|http):\/\/)?(github\.com\/.+?\/.+?\/(?:releases|archive|blob|raw)|((?:raw|gist)\.(?:githubusercontent|github)\.com))\/.+$/i

        const form = document.getElementById('form')
        const input = document.getElementById('q')
        const hint = document.getElementById('hint')
        const result = document.getElementById('result')
        const resultUrl = document.getElementById('result-url')
        const defaultHint = hint.textContent

        const NODES = [
            { value: 'ghgo.de5.net', label: 'ghgo.de5.net' },
            { value: 'gh-proxy.com', label: 'gh-proxy.com' },
            { value: 'ghfast.top', label: 'ghfast.top' },
        ]

        const TEST_IMG = 'https://raw.githubusercontent.com/microsoft/vscode/refs/heads/main/resources/linux/code.png'

        let selectedNode = NODES[0].value

        function fullUrl(v) {
            return /^https?:\/\//i.test(v) ? v : 'https://' + v
        }

        function activeBase() {
            return 'https://' + selectedNode + '/'
        }

        let current = ''
        let releasesData = null

        const REPO_RE = /^(?:https?:\/\/)?github\.com\/([^\/\s?#]+)\/([^\/\s?#]+)/i

        function refresh() {
            const value = input.value.trim()
            current = ''
            if (!value || !RE.test(value)) {
                result.hidden = true
                return
            }
            const base = activeBase()
            current = base + fullUrl(value)
            resultUrl.innerHTML = ''
            const origin = document.createElement('span')
            origin.className = 'origin'
            origin.textContent = base
            resultUrl.append(origin, document.createTextNode(fullUrl(value)))
            result.hidden = false
        }

        function openCurrent() {
            if (!current) refresh()
            if (current) window.open(current, '_blank', 'noopener')
        }

        async function copyText(text, btn) {
            let ok = false
            try { await navigator.clipboard.writeText(text); ok = true } catch (e) {}
            if (!ok) {
                try {
                    const ta = document.createElement('textarea')
                    ta.value = text
                    ta.style.position = 'fixed'
                    ta.style.opacity = '0'
                    document.body.appendChild(ta)
                    ta.select()
                    ok = document.execCommand('copy')
                    document.body.removeChild(ta)
                } catch (e) {}
            }
            if (btn) {
                const t = btn.textContent
                btn.textContent = ok ? '已复制' : '复制失败'
                setTimeout(function () { btn.textContent = t }, 1200)
            }
        }

        function openAccelerated() {
            const value = input.value.trim()
            if (!value) {
                hint.textContent = '请输入 GitHub 文件链接'
                input.focus()
                return
            }
            window.open(activeBase() + fullUrl(value))
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault()
            openAccelerated()
        })

        input.addEventListener('input', function () {
            if (hint.textContent !== defaultHint) hint.textContent = defaultHint
            refresh()
        })

        document.getElementById('copy-btn').addEventListener('click', function () {
            if (current) copyText(current, this)
        })
        document.getElementById('open-btn').addEventListener('click', openCurrent)

        const nodeList = document.getElementById('node-list')
        const speedBtn = document.getElementById('speed-btn')
        const latEls = {}

        function renderNodes() {
            NODES.forEach(function (n) {
                const el = document.createElement('button')
                el.type = 'button'
                el.className = 'node' + (n.value === selectedNode ? ' active' : '')
                el.dataset.value = n.value
                const top = document.createElement('span')
                top.className = 'node-top'
                const name = document.createElement('span')
                name.className = 'node-name'
                name.textContent = n.label
                const dot = document.createElement('span')
                dot.className = 'lat-dot'
                top.append(name, dot)
                const lat = document.createElement('span')
                lat.className = 'lat'
                lat.textContent = '未测速'
                const badge = document.createElement('span')
                badge.className = 'node-badge'
                badge.textContent = '最快'
                el.append(top, lat, badge)
                latEls[n.value] = { lat: lat, dot: dot }
                el.addEventListener('click', function () {
                    selectedNode = n.value
                    nodeList.querySelectorAll('.node').forEach(function (b) {
                        b.classList.toggle('active', b.dataset.value === selectedNode)
                    })
                    refresh()
                    if (releasesData) renderReleases()
                })
                nodeList.appendChild(el)
            })
        }

        function ping(base) {
            return new Promise(function (resolve) {
                const img = new Image()
                const t0 = performance.now()
                const timer = setTimeout(function () {
                    img.onload = img.onerror = null
                    img.src = ''
                    resolve(null)
                }, 8000)
                img.onload = function () {
                    clearTimeout(timer)
                    resolve(Math.round(performance.now() - t0))
                }
                img.onerror = function () {
                    clearTimeout(timer)
                    resolve(null)
                }
                img.src = base + TEST_IMG + '?t=' + Date.now()
            })
        }

        function setLat(parts, ms) {
            const lat = parts.lat, dot = parts.dot
            lat.classList.remove('fast', 'medium', 'slow')
            dot.classList.remove('fast', 'medium', 'slow')
            if (ms == null) { lat.textContent = '连接超时'; dot.classList.add('slow'); return }
            lat.textContent = ms + 'ms'
            const cls = ms <= 300 ? 'fast' : ms <= 1000 ? 'medium' : 'slow'
            lat.classList.add(cls)
            dot.classList.add(cls)
        }

        async function testAll() {
            if (speedBtn.disabled) return
            speedBtn.disabled = true
            speedBtn.textContent = '测速中…'
            const results = await Promise.all(NODES.map(async function (n) {
                const parts = latEls[n.value]
                parts.lat.classList.remove('fast', 'medium', 'slow')
                parts.dot.classList.remove('fast', 'medium', 'slow')
                parts.lat.textContent = '测速中…'
                const ms = await ping('https://' + n.value + '/')
                setLat(parts, ms)
                return { value: n.value, ms: ms }
            }))
            nodeList.querySelectorAll('.node').forEach(function (b) { b.classList.remove('recommended') })
            const ok = results.filter(function (r) { return r.ms != null })
            if (ok.length) {
                const best = ok.reduce(function (a, b) { return a.ms <= b.ms ? a : b })
                const btn = nodeList.querySelector('.node[data-value="' + best.value + '"]')
                if (btn) btn.classList.add('recommended')
            }
            speedBtn.disabled = false
            speedBtn.textContent = '测速'
        }

        const RELEASE_API_BASES = [
            'https://api.github.com',
            'https://gh-proxy.com/https://api.github.com',
        ]

        function fmtSize(bytes) {
            if (!bytes) return '0 B'
            const u = ['B', 'KB', 'MB', 'GB']
            let n = bytes, i = 0
            while (n >= 1024 && i < u.length - 1) { n /= 1024; i++ }
            return n.toFixed(i ? 1 : 0) + ' ' + u[i]
        }

        function fmtTime(s) {
            const d = new Date(s)
            const p = function (x) { return String(x).padStart(2, '0') }
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
                ' ' + p(d.getHours()) + ':' + p(d.getMinutes())
        }

        async function fetchReleases(owner, repo) {
            let lastErr = null
            for (const base of RELEASE_API_BASES) {
                try {
                    const res = await fetch(base + '/repos/' + owner + '/' + repo + '/releases')
                    if (res.status === 404) throw new Error('仓库不存在或没有 Releases')
                    if (!res.ok) {
                        lastErr = new Error('接口返回 ' + res.status)
                        continue
                    }
                    const data = await res.json()
                    if (!Array.isArray(data)) {
                        lastErr = new Error('接口返回格式异常')
                        continue
                    }
                    if (data.length === 0) throw new Error('该仓库没有 Releases')
                    return data
                } catch (e) {
                    if (/不存在|没有 Releases/.test(e.message)) throw e
                    lastErr = e
                }
            }
            throw lastErr || new Error('获取失败，请稍后再试')
        }

        function renderReleases() {
            const box = document.getElementById('releases')
            box.innerHTML = ''
            if (!releasesData || !releasesData.length) { box.hidden = true; return }
            const base = activeBase()
            releasesData.forEach(function (rel) {
                const item = document.createElement('div')
                item.className = 'release'
                const head = document.createElement('div')
                head.className = 'release-head'
                const tag = document.createElement('a')
                tag.className = 'release-tag'
                tag.textContent = rel.tag_name
                tag.href = rel.html_url
                tag.target = '_blank'
                tag.rel = 'noopener'
                const meta = document.createElement('span')
                meta.className = 'release-meta'
                meta.textContent = fmtTime(rel.published_at) + ' · ' + rel.assets.length + ' 个文件'
                head.append(tag, meta)
                item.appendChild(head)
                rel.assets.forEach(function (a) {
                    const row = document.createElement('div')
                    row.className = 'asset'
                    const name = document.createElement('span')
                    name.className = 'asset-name'
                    name.textContent = a.name
                    const size = document.createElement('span')
                    size.className = 'asset-size'
                    size.textContent = fmtSize(a.size)
                    const dl = document.createElement('a')
                    dl.className = 'asset-dl'
                    dl.textContent = '下载'
                    dl.href = base + a.browser_download_url
                    dl.target = '_blank'
                    dl.rel = 'noopener'
                    row.append(name, size, dl)
                    item.appendChild(row)
                })
                box.appendChild(item)
            })
            box.hidden = false
        }

        document.getElementById('releases-btn').addEventListener('click', async function () {
            const value = input.value.trim()
            const m = value.match(REPO_RE)
            if (!m) {
                hint.textContent = '请粘贴仓库链接，如 github.com/owner/repo'
                input.focus()
                return
            }
            const owner = m[1]
            const repo = m[2].replace(/\.git$/, '')
            const btn = this
            const box = document.getElementById('releases')
            btn.disabled = true
            const oldText = btn.textContent
            btn.textContent = '获取中…'
            box.hidden = false
            box.innerHTML = ''
            const tip = document.createElement('p')
            tip.className = 'releases-tip'
            tip.textContent = '正在获取 ' + owner + '/' + repo + ' 的 Releases…'
            box.appendChild(tip)
            try {
                releasesData = await fetchReleases(owner, repo)
                hint.textContent = defaultHint
                renderReleases()
            } catch (e) {
                releasesData = null
                box.innerHTML = ''
                const err = document.createElement('p')
                err.className = 'releases-err'
                err.textContent = '获取失败：' + e.message
                box.appendChild(err)
            } finally {
                btn.disabled = false
                btn.textContent = oldText
            }
        })

        renderNodes()
        speedBtn.addEventListener('click', testAll)
        testAll()

       const themeToggle = document.getElementById('theme-toggle')
if (themeToggle) {
    themeToggle.addEventListener('click', function () {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
        document.documentElement.setAttribute('data-theme', next)
        try { localStorage.setItem('theme', next) } catch (e) {}
    })
}

        /* ================= 留言板 ================= */
        (function () {
            // ⚠️ 改成你自己的 Worker 地址
            var API = 'https://ghgo-aip.ghgo.workers.dev';

            var form = document.getElementById('gb-form');
            var nameInput = document.getElementById('gb-name');
            var textInput = document.getElementById('gb-text');
            var tip = document.getElementById('gb-tip');
            var submitBtn = document.getElementById('gb-submit');
            var list = document.getElementById('gb-list');
            var countEl = document.getElementById('gb-count');

            if (!form) return;

            function fmtTime(ts) {
                var d = new Date(ts);
                var p = function (x) { return String(x).padStart(2, '0') };
                return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
                    ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
            }

            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function render(items) {
                list.innerHTML = '';
                if (!items.length) {
                    list.innerHTML = '<p class="gb-empty">还没有留言，来抢沙发～</p>';
                    countEl.textContent = '';
                    return;
                }
                countEl.textContent = items.length + ' 条';
                items.slice().reverse().forEach(function (it) {
                    var div = document.createElement('div');
                    div.className = 'gb-item';
                    div.innerHTML =
                        '<div class="gb-item-head">' +
                            '<span class="gb-item-name">' + escapeHtml(it.name || '匿名') + '</span>' +
                            '<span class="gb-item-time">' + fmtTime(it.time) + '</span>' +
                        '</div>' +
                        '<div class="gb-item-text">' + escapeHtml(it.text) + '</div>';
                    list.appendChild(div);
                });
            }

            async function load() {
                try {
                    var res = await fetch(API + '?t=' + Date.now());
                    var data = await res.json();
                    render(Array.isArray(data) ? data : []);
                } catch (e) {
                    list.innerHTML = '<p class="gb-empty">留言加载失败，请稍后再试</p>';
                }
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                var text = textInput.value.trim();
                if (!text) { tip.textContent = '请先写点内容'; return; }
                if (text.length > 300) { tip.textContent = '最多 300 字'; return; }

                submitBtn.disabled = true;
                tip.textContent = '发布中…';

                try {
                    var res = await fetch(API, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            name: nameInput.value.trim().slice(0, 20),
                            text: text
                        })
                    });
                    var data = await res.json();
                    if (!data.ok) throw new Error(data.error || '发布失败');

                    textInput.value = '';
                    tip.textContent = '发布成功！';
                    setTimeout(function () { tip.textContent = ''; }, 2000);
                    await load();
                } catch (err) {
                    tip.textContent = err.message || '发布失败，请稍后再试';
                } finally {
                    submitBtn.disabled = false;
                }
            });

            load();
        })();
    </script>
