<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>GitHub 文件加速下载 - Release、Raw 与源码代理</title>
    <meta name="description" content="免费的 GitHub 文件加速工具，支持 releases 下载、源码归档、blob、raw、gist 与 tags 等链接加速，无需登录即可使用。">
    <link rel="icon" href="/favicon.ico">
    <style>
        :root {
            --bg: #f4f6fb;
            --bg-accent: #e7ecf9;
            --card: #ffffff;
            --text: #1c2233;
            --muted: #6b7488;
            --border: #e2e6f0;
            --primary: #3b6cf6;
            --primary-hover: #2f5ae0;
            --primary-ring: rgba(59, 108, 246, .25);
            --chip: #f0f3fa;
            --shadow: 0 20px 50px -20px rgba(28, 34, 51, .28);
        }

        :root[data-theme="dark"] {
            --bg: #0e1220;
            --bg-accent: #141a2e;
            --card: #171d30;
            --text: #e9edf6;
            --muted: #9aa3ba;
            --border: #262e46;
            --primary: #5b86ff;
            --primary-hover: #6f95ff;
            --primary-ring: rgba(91, 134, 255, .3);
            --chip: #1f2740;
            --shadow: 0 24px 60px -24px rgba(0, 0, 0, .7);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text);
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            background:
                radial-gradient(1200px 600px at 15% -10%, var(--bg-accent), transparent 60%),
                radial-gradient(1000px 500px at 110% 110%, var(--bg-accent), transparent 55%),
                var(--bg);
        }

        .card {
            width: 100%;
            max-width: 640px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 36px 32px;
            box-shadow: var(--shadow);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .brand svg { flex: none; }

        .theme-toggle {
            margin-left: auto;
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--chip);
            color: var(--muted);
            border: 1px solid transparent;
            cursor: pointer;
            transition: background .15s, color .15s, border-color .15s;
        }

        .theme-toggle:hover { color: var(--primary); border-color: var(--border); }
        .theme-toggle svg { display: none; }
        :root[data-theme="light"] .theme-toggle .icon-moon { display: block; }
        :root[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

        h1 {
            font-size: 26px;
            line-height: 1.25;
            margin: 0;
            letter-spacing: .2px;
        }

        .subtitle {
            margin: 0 0 26px;
            color: var(--muted);
            font-size: 14.5px;
            line-height: 1.6;
        }

        form { margin: 0; }

        .field {
            display: flex;
            gap: 10px;
        }

        .input-wrap {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .input-wrap svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        input.url {
            width: 100%;
            height: 52px;
            padding: 0 16px 0 42px;
            font-size: 15px;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
        }

        input.url::placeholder { color: var(--muted); }

        input.url:focus {
            border-color: var(--primary);
            background: var(--card);
            box-shadow: 0 0 0 4px var(--primary-ring);
        }

        .btn {
            height: 52px;
            padding: 0 26px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s ease, transform .05s ease;
        }

        .btn:hover { background: var(--primary-hover); }
        .btn:active { transform: translateY(1px); }

        .hint {
            margin-top: 10px;
            font-size: 12.5px;
            color: var(--muted);
            min-height: 16px;
        }

        .result {
            margin-top: 12px;
            padding: 13px 15px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .result-label {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: .04em;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .result-url {
            display: block;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12.5px;
            line-height: 1.55;
            color: var(--text);
            word-break: break-all;
        }

        .result-url .origin { color: var(--primary); }

        .result-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .mini {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 7px 14px;
            cursor: pointer;
            transition: border-color .15s, color .15s, background .15s;
        }

        .mini:hover { border-color: var(--primary); color: var(--primary); }

        .mini.primary {
            color: #fff;
            background: var(--primary);
            border-color: transparent;
        }

        .mini.primary:hover { background: var(--primary-hover); color: #fff; }

        .mini:disabled { opacity: .6; cursor: default; }

        .nodes {
            margin-top: 22px;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px 16px 14px;
            background: var(--bg);
        }

        .nodes-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .nodes-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .nodes-head-actions {
            display: flex;
            gap: 8px;
            flex: none;
        }

        .node-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
        }

        .node {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 7px;
            font: inherit;
            text-align: left;
            color: var(--text);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 11px 13px;
            cursor: pointer;
            transition: border-color .15s, box-shadow .15s, transform .05s;
        }

        .node:hover { border-color: var(--primary); }

        .node:active { transform: translateY(1px); }

        .node.active {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-ring);
        }

        .node-top {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .node-name {
            flex: 1;
            min-width: 0;
            font-size: 13px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .node.active .node-name { color: var(--primary); }

        .lat-dot {
            flex: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            transition: background .15s;
        }

        .lat-dot.fast { background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, .18); }
        .lat-dot.medium { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245, 158, 11, .18); }
        .lat-dot.slow { background: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, .18); }

        .lat {
            font-size: 12px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .lat.fast { color: #16a34a; }
        .lat.medium { color: #d97706; }
        .lat.slow { color: #dc2626; }

        .node-badge {
            position: absolute;
            top: -8px;
            right: 10px;
            font-size: 10px;
            font-weight: 600;
            line-height: 1;
            color: #fff;
            background: #22c55e;
            border-radius: 999px;
            padding: 3px 7px;
            display: none;
        }

        .node.recommended .node-badge { display: inline-block; }

        .releases {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .release {
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            background: var(--card);
        }

        .release-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 12px 15px;
            background: var(--bg);
        }

        .release-tag {
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
        }

        .release-tag:hover { text-decoration: underline; }

        .release-meta {
            font-size: 12.5px;
            color: var(--muted);
        }

        .asset {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            border-top: 1px solid var(--border);
            font-size: 13px;
        }

        .asset-name {
            flex: 1;
            min-width: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 12px;
            word-break: break-all;
        }

        .asset-size {
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .asset-dl {
            flex: none;
            font-size: 12.5px;
            font-weight: 600;
            color: #fff;
            background: var(--primary);
            border-radius: 8px;
            padding: 5px 12px;
            text-decoration: none;
            transition: background .15s;
        }

        .asset-dl:hover { background: var(--primary-hover); }

        .releases-tip,
        .releases-err {
            margin: 0;
            padding: 14px 16px;
            font-size: 13px;
            color: var(--muted);
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

.footer .footer-icon {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; padding: 8px 16px; border-radius: 999px;
    background: var(--chip); color: var(--muted) !important;
    font-size: 12px; text-decoration: none;
    transition: background .2s, color .2s;
}
.footer .footer-icon:hover {
    background: var(--primary); color: #fff !important;
}

        .notes {
            margin: 26px 0 0;
            padding: 16px 18px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.7;
        }

.notes ul {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 12px;
    list-style: none;
    padding: 0;
    margin: 0;
}
.notes li {
    display: flex;
    gap: 8px;
}
.notes li::before {
    content: "•";
    color: var(--primary);
}

        .footer {
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 12.5px;
            color: var(--muted);
            text-align: center;
        }

        @media (max-width: 560px) {
            .card { padding: 28px 22px 24px; border-radius: 16px; }
            .field { flex-direction: column; }
            .btn { width: 100%; }
            h1 { font-size: 22px; }
        }
        button:focus,
button:active,
a:focus,
a:active {
    outline: none;
    box-shadow: none;
}

* {
    -webkit-tap-highlight-color: transparent;
}
    </style>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme')
                var theme = saved ? saved : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                document.documentElement.setAttribute('data-theme', theme)
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light')
            }
        })()
    </script>
</head>

<p class="subtitle">粘贴 GitHub 链接，加速下载 release、源码归档或单文件。</p>

        <form action="./" method="get" target="_blank" id="form" novalidate>
            <div class="field">
                <label class="input-wrap">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72"

                           required>
                </label>
                <button class="btn" type="submit">加速下载</button>

                    <button class="mini primary" id="open-btn" type="button">下载</button>

            <div class="releases" id="releases" hidden></div>

            background:#FF813F; color:#fff; cursor:pointer;">关闭</button>
  </div>

<script>
(function () {
  var modal = document.getElementById('donateModal');
  var btn = document.getElementById('donateBtn');
  var close = document.getElementById('donateClose');
  if (!modal || !btn) return;

  btn.onclick = function () { modal.style.display = 'flex'; };
  close.onclick = function () { modal.style.display = 'none'; };
  modal.onclick = function (e) {
    if (e.target === modal) modal.style.display = 'none';
  };
})();
</script>
